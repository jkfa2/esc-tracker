name: Site monitor

on:
  schedule:
    - cron: "7,37 * * * *"   # backup; the real rhythm comes from cron-job.org
  workflow_dispatch:
  push:
    paths: ["config.yaml"]

concurrency:
  group: site-monitor
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Check all enabled watchers
        run: python monitor.py run
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}

      - name: Save state
        run: |
          git config user.name "site-monitor[bot]"
          git config user.email "actions@users.noreply.github.com"
          git add state
          if ! git diff --cached --quiet; then
            git commit -m "Update state"
            git pull --rebase --autostash -q
            git push
          fi
