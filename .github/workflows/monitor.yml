name: Site monitor

on:
  schedule:
    # Every 15 minutes. GitHub may delay scheduled runs by a few minutes; 5 min is the minimum.
    # Private repo? Use "*/30 * * * *" or less often to stay inside the free minutes (see README).
    - cron: "*/15 * * * *"
  workflow_dispatch:        # "Run workflow" button in the Actions tab
  push:
    paths: ["config.yaml"]  # run right after you edit the config (records a baseline for new watchers)

concurrency:
  group: site-monitor
  cancel-in-progress: false  # never run two at once, they would fight over the state files

permissions:
  contents: write            # needed to commit the state files back

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Check all enabled watchers
        run: python monitor.py run
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          GOOGLE_TRANSLATE_API_KEY: ${{ secrets.GOOGLE_TRANSLATE_API_KEY }}   # optional: headline translations

      - name: Save state
        run: |
          git config user.name "site-monitor[bot]"
          git config user.email "actions@users.noreply.github.com"
          git add state
          if ! git diff --cached --quiet; then
            git commit -m "Update state"
            git pull --rebase --autostash -q
            git push
          fi
