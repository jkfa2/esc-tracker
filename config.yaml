# ─────────────────────────────────────────────────────────────────────────────
# Site monitor config
#
#   Pause a watcher:   enabled: true  →  enabled: false   (commit; applies on the next run)
#   Add a watcher:     copy a block of the same type, change name + url, commit.
#                      The first run only records a baseline (no notifications).
#   Display name:      `label:` is what Discord shows. Keep `name:` stable (it names the file in state/).
#   Keywords:          keywords: ["eurovizij"] → only report items containing a word STARTING with it
#                      (so endings are covered). "=esc" = exact word only, "*word" = also inside words.
#   Quoting:           put "quotes" around any value containing a colon followed by a space, or emoji.
#
#   Test locally:      python monitor.py test "<name>"      python monitor.py match "<keyword>" "<text>"
# ─────────────────────────────────────────────────────────────────────────────

defaults:
  timeout: 30            # seconds per request
  fail_alert_after: 8    # Discord alert after this many failed runs in a row (and again when it recovers)
  # user_agent: "..."    # optional; default looks like a normal browser
  translate: en

watchers:

  # ═══════════════════════════════════════════════════════════════════════════
  # 1. SITEMAPS
  #    deep: true → when a child sitemap changes, report WHICH URLs are new or changed.
  #    Optional: 
  #      - include_children: only looks at the sitemaps you care about (e.g., include_children: ["post-sitemap"])
  #      - exclude_children: exclude certain sitemaps (same logic as above)
  #      - ignore_urls: ignore URLs that contain specific values (e.g., ignore_urls: ["/tag/", "/author/"])
  #      - notify_removed: get notification if a URL gets removed from the sitemap (e.g., notify_removed: true). False by default. 
  # ═══════════════════════════════════════════════════════════════════════════

  - name: Albania - FiK Sitemap
    label: 🇦🇱 festivali.rtsh.al - Sitemap
    type: sitemap
    url: https://festivali.rtsh.al/sitemap_index.xml
    enabled: false
    deep: true

  - name: Cyprus - RIK Corporate Sitemap
    label: 🇨🇾 corporate.rik.cy - Sitemap
