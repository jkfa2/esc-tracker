# ─────────────────────────────────────────────────────────────────────────────
# Site monitor config
#
#   Pause a watcher:   enabled: true  →  enabled: false   (commit; applies on the next run)
#   Add a watcher:     copy a block of the same type, change name + url, commit.
#                      The first run only records a baseline (no notifications).
#   Display name:      `label:` is what Discord shows. Keep `name:` stable (it names the file in state/).
#   Keywords:          keywords: ["eurovizij"] → only report items containing a word STARTING with it
#                      (so endings are covered). "=esc" = exact word only, "*word" = also inside words.
#   Quoting:           put "quotes" around any value containing a colon followed by a space, or emoji.
#
#   Test locally:      python monitor.py test "<name>"      python monitor.py match "<keyword>" "<text>"
# ─────────────────────────────────────────────────────────────────────────────

defaults:
  timeout: 30            # seconds per request
  fail_alert_after: 3    # Discord alert after this many failed runs in a row (and again when it recovers)
  # user_agent: "..."    # optional; default looks like a normal browser
  # translate: en        # translate headlines of new items into English (needs the GOOGLE_TRANSLATE_API_KEY secret).
  #                      # Switch it off for one watcher (e.g. an English site) with `translate: false` on that watcher.

watchers:

  # ═══════════════════════════════════════════════════════════════════════════
  # 1. SITEMAPS
  #    deep: true → when a child sitemap changes, report WHICH URLs are new or changed.
  #    Optional: include_children / exclude_children (regexes on child sitemap URLs),
  #              ignore_urls (regexes on page URLs), notify_removed: true
  # ═══════════════════════════════════════════════════════════════════════════

  - name: Romania sitemap
    type: sitemap
    url: https://eurovisionromania.ro/sitemap.xml
    enabled: true
    deep: true

  - name: Malta sitemap
    type: sitemap
    url: https://maltaeurovision.mt/sitemap_index.xml
    enabled: true
    deep: true

  - name: Ukraine sitemap
    type: sitemap
    url: https://eurovision.ua/sitemap_index.xml
    enabled: false          # paused: Cloudflare blocks GitHub's servers (403)
    deep: true

  # ── Not set up yet: page diffs for sitemaps ────────────────────────────────
  #    Add these lines to any sitemap watcher above to see WHAT changed on each page:
  #      snapshots: true
  #      snapshot_selector: "article"     # or "main": focus on the real content
  #    The first run silently saves the 30 most recent pages; diffs appear from then on.

  # ═══════════════════════════════════════════════════════════════════════════
  # 2. WORDPRESS REST API
  #    Reports new IDs, changed `modified` dates and changes in the total count.
  #    Optional: pages: 2, cache_bust: true, params: {status: publish}
  # ═══════════════════════════════════════════════════════════════════════════

  - name: Albania media
    type: wordpress
    url: https://festivali.rtsh.al/wp-json/wp/v2/media
    enabled: true

  - name: Albania artists
    type: wordpress
    url: https://festivali.rtsh.al/wp-json/wp/v2/artistet/
    enabled: true

  - name: Malta media
    type: wordpress
    url: https://maltaeurovision.mt/wp-json/wp/v2/media
    enabled: true
    cache_bust: true        # adds a random ?_cb= parameter to get past a cache that ignores the query string
    # Run `python monitor.py test "Malta media"` and look at the "X-WP-Total header" line.

  # ── Not set up yet: text diffs for WordPress ───────────────────────────────
  #    Works for posts, pages and custom post types such as "artistet". Add to a watcher:
  #      diff: true
  #    (Media items have no content; for those use: diff: true  +  diff_fields: ["description", "caption"])

  # ═══════════════════════════════════════════════════════════════════════════
  # 3. GENERAL PAGES
  #    mode: text  (default) → the page gets EDITED: shows the changed lines
  #    mode: links           → a LIST that grows: shows only new links
  #    Optional: selector, exclude_selectors, ignore_patterns, keywords
  # ═══════════════════════════════════════════════════════════════════════════

  - name: San Marino casting
    type: page
    url: https://dreamingsanmarinosongcontest.com/casting/
    enabled: true
    mode: text
    exclude_selectors: ["header", "footer", "nav"]

  - name: RTL Eurovision homepage
    type: page
    url: https://eurovision.rtl.lu/
    enabled: true
    mode: links             # tip: add `selector:` for just the article list once you've picked it

  - name: RTL search Eurovision
    type: page
    url: https://www.rtl.lu/search?q=Eurovision
    enabled: true
    mode: links
    # If `test` shows no results, the page is rendered by JavaScript and needs a headless browser.

  # ── Not set up yet: keywords on pages ──────────────────────────────────────
  #    Example: a news homepage where you only want links about the contest.
  #      - name: Example news homepage
  #        type: page
  #        url: https://example.com/
  #        mode: links
  #        keywords: ["songfestival", "eurovisie"]

  # ═══════════════════════════════════════════════════════════════════════════
  # 4. RSS / ATOM
  #    Reports each new item. Optional: keywords, max_per_run (default 10)
  # ═══════════════════════════════════════════════════════════════════════════

  - name: RUV Eurovision
    type: rss
    url: https://www.ruv.is/rss/tag/eurovision
    enabled: true

  - name: Expressen Melodifestivalen
    type: rss
    url: https://feeds.expressen.se/noje/melodifestivalen
    enabled: true

  - name: EBU news
    type: rss
    url: https://www.ebu.ch/rss-search/header/news/news-1/latest_EBU_news.rss
    enabled: true

  # General news feed, filtered on keywords (endings like Eurovizijos/Eurovizijoje are covered)
  - name: Lithuania LRT
    label: "🇱🇹 Lithuania · LRT"
    type: rss
    url: https://www.lrt.lt/?rss      # unverified: open it in a browser, it should show XML, not a web page
    enabled: true
    keywords: ["eurovizij", "eurovision"]
