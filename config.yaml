  #    Works for posts, pages and custom post types such as "artistet". Add to a watcher:
  #      - diff: true. Add and set to true; checks more fields (without this it checks title, link, and modified date).
  #      - diff_fields: true. Use with /media as those have no content. You can e.g. use ["description", "caption"]
  #    (Media items have no content; for those use: diff: true  +  diff_fields: ["description", "caption"])

  # ═══════════════════════════════════════════════════════════════════════════
  # 3. GENERAL PAGES
  #    mode: text  (default) → the page gets EDITED: shows the changed lines
  #    mode: links           → a LIST that grows: shows only new links
  #    Optional: 
  #      - selector: choose part of the page to focus on. Use with the bookmark added to Chrome. For example, selector: "media"
  #      - exclude_selectors: choose parts of page to ignore, like "header" or "footer"
  #      - ignore_patterns: ignore certain text parts on page. For example, ignore_patterns: ['^Updated', 'views$', '\d+ comments']
  #      - keywords: filter on specific keywords. Matches with beginning (so "Eurovis" finds "Eurovision"). For exact matches use = (e.g. =esc).
  #                  Use *songfestival to catch "Eurovisiesongfestival"
  # ═══════════════════════════════════════════════════════════════════════════

