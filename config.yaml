  # ── Not set up yet: page diffs for sitemaps ────────────────────────────────
  #    Add these lines to any sitemap watcher above to see WHAT changed on each page:
  #      - snapshots: true or false. Saves the 30 most recent pages and compares diffs across them.
  #                       Use with snapshot_selector to get the right selection.
  #      - snapshot_selector: use with bookmark you added to Chrome. Only compares the section(s) you specify (e.g., snapshot_selector: ["media", "content"])
  #    The first run silently saves the 30 most recent pages; diffs appear from then on.

  # ═══════════════════════════════════════════════════════════════════════════
  # 2. WORDPRESS REST API
  #    Reports new IDs, changed `modified` dates, and changes in the total count.
  #    Optional: 
  #      - pages: put any number of pages for the REST API. Default takes 100 items, so `pages: 2` would take 200, etc.
  #      - cache_bust: true/false. Breaks cached pages as sometimes pages keep them.
  #      - params: extra REST API filters. For example, params: categories: 12, per_page: 20 (note: these need to be indented!).
  # ═══════════════════════════════════════════════════════════════════════════

